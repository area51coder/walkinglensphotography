<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/main.css">

  <style>
    body {
      background: #111;
      color: #fff;
    }

    .portfolio-title {
      text-align: center;
      padding: 40px 0;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      padding: 20px;
      justify-content: center;
    }

    .gallery img {
      width: 300px;
      height: 200px;
      object-fit: cover;
      cursor: pointer;
      transition: 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    /* LIGHTBOX */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.9);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 80%;
    }

    .lightbox.active {
      display: flex;
    }

    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      color: white;
      font-size: 18px;
      text-decoration: none;
    }
  </style>
</head>

<body>

<a href="index.html" class="back-btn">⬅ Back</a>

<div class="portfolio-title">
  <h1>My Portfolio</h1>
  <p>Click image to view</p>
</div>

<div class="gallery">
  <img src="img/recent1.jpg">
  <img src="img/recent2.jpg">
  <img src="img/recent3.jpg">
  <img src="img/recent4.jpg">
  <img src="img/recent5.jpg">
  <img src="img/recent6.jpg">
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <img src="" id="lightbox-img">
</div>

<script>
  const images = document.querySelectorAll('.gallery img');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');

  images.forEach(img => {
    img.addEventListener('click', () => {
      lightbox.classList.add('active');
      lightboxImg.src = img.src;
    });
  });

  lightbox.addEventListener('click', () => {
    lightbox.classList.remove('active');
  });
</script>

</body>
</html>
